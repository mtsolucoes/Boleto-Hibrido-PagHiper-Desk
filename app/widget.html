<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Boletos PagHiper</title>
	<!--
		IMPORTANTE: o "src" abaixo é o SDK padrão de widgets do Desk gerado pelo
		zet init. Confira no seu próprio projeto (dentro de app/) qual script o
		zet já referenciou por padrão e mantenha esse mesmo caminho aqui.
	-->
	<script src="https://js.zohostatic.com/desk/DeskAppClient.js"></script>
	<style>
		body { font-family: -apple-system, Arial, sans-serif; padding: 14px; margin:0; }
		button {
			display:block; width:100%; margin-bottom:8px; padding:10px;
			border:1px solid #ccc; border-radius:6px; cursor:pointer;
			background:#f7f7f7; font-size: 14px;
		}
		button:hover { background:#eee; }
		#status { margin-top:10px; font-size: 13px; color:#333; min-height: 18px; }
	</style>
</head>
<body>
	<button id="btnGerar">Gerar Boleto</button>
	<button id="btnConsultar">Consultar Status</button>
	<button id="btnCancelar">Cancelar Boleto</button>
	<div id="status"></div>

<script>
var ticketId = null;

// Inicializa o SDK e captura o ID do ticket atual.
// O nome do objeto global (ZOHODESK / ZFAPPS) e do método de leitura do
// ticket.id pode variar conforme a versão do SDK gerada pelo seu zet init.
// Confirme os nomes exatos olhando o arquivo de exemplo que o próprio
// "zet init" já criou dentro da pasta app/ do seu projeto.
ZOHODESK.extension.onload().then(function (App) {
	ZOHODESK.get("ticket.id").then(function (data) {
		ticketId = data["ticket.id"];
	});
});

function setStatus(msg) {
	document.getElementById("status").innerText = msg;
}

function chamarFuncao(nomeFuncao) {
	if (!ticketId) {
		setStatus("Aguardando carregar o ticket...");
		return;
	}
	setStatus("Processando...");

	// A chamada abaixo é o ponto que precisa ser confirmado/ajustado.
	// Ao criar cada função em Sigma > Functions, clique em "Invoke as REST API"
	// no editor da função: a Zoho vai te dar um snippet pronto (URL + parâmetros
	// de execução) equivalente a este ZOHODESK.invoke. Copie esse snippet oficial
	// e substitua a linha abaixo por ele, mantendo o "ticketId" como parâmetro.
	ZOHODESK.invoke(nomeFuncao, { ticketId: ticketId })
		.then(function (response) {
			setStatus(response.message || "Concluído.");
		})
		.catch(function (err) {
			setStatus("Erro: " + JSON.stringify(err));
		});
}

document.getElementById("btnGerar").onclick = function () { chamarFuncao("Gerar_Boleto_Desk"); };
document.getElementById("btnConsultar").onclick = function () { chamarFuncao("Consultar_Boleto_Desk"); };
document.getElementById("btnCancelar").onclick = function () { chamarFuncao("Cancelar_Boleto_Desk"); };
</script>
</body>
</html>
